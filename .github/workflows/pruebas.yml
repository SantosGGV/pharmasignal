name: Pruebas unitarias

# El flujo se dispara en cada incorporación de código a la rama principal y en
# cada propuesta de cambio, de modo que una modificación no puede introducir
# una regresión en el cálculo estadístico sin ser detectada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El flujo solo lee el repositorio: el token no necesita más permisos (0.7).
permissions:
  contents: read

jobs:
  pruebas:
    name: Verificación de las expresiones estadísticas
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Las pruebas operan sobre DataFrames de Spark, que se ejecuta sobre una
      # máquina virtual de Java.
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Desde la 0.7 se instala el bloqueo completo en un entorno recién creado:
      # además de las pruebas, el flujo comprueba que una instalación limpia da
      # exactamente las versiones de requirements.txt.
      - name: Instalar el bloqueo en un entorno limpio
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir -r requirements.txt

      - name: Comprobar que lo instalado es el bloqueo
        run: |
          pip check
          python scripts/deps/comprobar_bloqueo.py requirements.txt

      # Las herramientas de desarrollo no pueden mover ninguna versión del bloqueo.
      - name: Instalar las herramientas de desarrollo
        run: |
          pip install --no-cache-dir -r requirements-dev.txt
          pip check
          python scripts/deps/comprobar_bloqueo.py --permitir-sobrantes requirements.txt requirements-dev.txt

      # Los tres bloqueos son completos: --no-deps audita sin resolver.
      # stanza 1.10.1 (PYSEC-2026-3075) es una excepción aceptada en la 0.7 (ADR 0020).
      - name: Auditar vulnerabilidades
        run: |
          pip-audit --no-deps --disable-pip -r requirements.txt
          pip-audit --no-deps --disable-pip -r requirements-interfaz.txt
          pip-audit --no-deps --disable-pip -r requirements-traduccion.txt --ignore-vuln PYSEC-2026-3075

      - name: Ejecutar las pruebas
        run: pytest tests/ -v

  imagen:
    name: Construcción de la imagen de la interfaz
    runs-on: ubuntu-latest

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      # La imagen se construye para comprobarla; no se publica en ningún registro.
      - name: Construir la imagen
        run: docker build -f docker/Dockerfile -t pharmasignal:ci .

      - name: Comprobar que la imagen instala el bloqueo de la interfaz
        run: |
          docker run --rm \
            -v "$PWD/scripts:/app/scripts:ro" \
            -v "$PWD/requirements-interfaz.txt:/app/requirements-interfaz.txt:ro" \
            --entrypoint python pharmasignal:ci \
            scripts/deps/comprobar_bloqueo.py requirements-interfaz.txt

      - name: Recorrer la interfaz con AppTest (datos de demo)
        run: |
          docker run --rm -v "$PWD/scripts:/app/scripts:ro" \
            --entrypoint python pharmasignal:ci scripts/comprobar_interfaz.py

      - name: Arrancar el servidor y comprobar su estado
        run: |
          docker run -d --name pharmasignal -p 8501:8501 pharmasignal:ci
          curl -fsS --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 \
            http://localhost:8501/_stcore/health
          docker stop pharmasignal
