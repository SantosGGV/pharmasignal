# Configuración de PharmaSignal
#
# Fichero único de umbrales y rutas. Lo lee src/config.py, que expone cada
# valor con el prefijo de su sección (por ejemplo, [senal] prr_min pasa a ser
# config.SENAL_PRR_MIN) para que no choquen claves iguales de secciones
# distintas.
#
# Cambiar un umbral cambia los resultados: hay que regenerar las tablas
# afectadas ejecutando su script.

[rutas]
# Relativas a la base del proyecto. La base es la raíz del repositorio, salvo
# que se defina la variable de entorno PHARMASIGNAL_BASE.
raw = "data/raw"
curated = "data/curated"
diccionarios = "data/diccionarios"
outputs = "outputs"
logs = "outputs/logs"

[senal]
# Criterio de señal de Evans et al. (2001): PRR >= 2, a >= 3 y chi2 >= 4.
# Usado en prr_ror.py y medir_escalabilidad.py.
prr_min = 2.0
casos_min = 3
chi2_min = 4.0
# El ROR cuenta como significativo si el límite inferior de su IC95 es
# estrictamente mayor que este valor.
ror_ic_inf_umbral = 1.0

[interfaz]
# Respaldo mínimo, en casos, para mostrar una señal confirmada en la interfaz.
# validar_senales.py aplica el mismo criterio.
min_casos_respaldo = 20

[listados]
# Filtro de señales triviales: el listado de consola de prr_ror.py y la casilla
# «Ocultar señales triviales» de la interfaz exigen un mínimo en las otras
# casillas de la tabla 2x2 (c, y a+b = reportes del fármaco).
trivial_min_c = 100
trivial_min_reportes_farmaco = 200

[geografia]
# Usados en analisis_geografico.py, curar_geografia.py y la interfaz.
min_casos_es = 5                  # mínimo de casos en España para evaluar una señal
min_casos_global = 20             # mínimo de casos globales para comparar con España
min_casos_divergencia = 30        # mínimo en España para el análisis de divergencia
min_global_divergencia = 150      # mínimo global para el análisis de divergencia
min_reportes_pais = 5000          # mínimo de notificaciones de un país para los rankings
# Desde 2025Q3 FAERS mete a España en el agregado europeo.
ultimo_trimestre_es = "2025q2"
trimestres_recodificados = ["2025q3", "2025q4"]

[explorador]
# Umbrales de entidad de los catálogos y cruces del constructor.
min_reportes_farmaco = 5000
min_casos_reaccion = 1000
min_reportes_pais = 10000

[lanzador]
# Usados en src/lanzador.py. El candado es único para toda la máquina (no por
# base ni por worktree), para que nunca corran dos ejecuciones de Spark a la vez.
candado = "~/.cache/pharmasignal/pipeline.lock"
# Espacio libre mínimo, en GB, en la partición de la base y en la temporal de
# Spark. Es un suelo estimado, no medido. En WSL2 el disco virtual aparenta más
# espacio del que hay: manda el libre del disco de Windows (df -h /mnt/c).
espacio_min_gb = 25
# Discos que también se miden si existen. En WSL2 el disco de Linux es virtual
# y se guarda en C:, así que el que se llena de verdad es /mnt/c. Se exige el
# mínimo en el disco con menos espacio libre.
discos_extra = ["/mnt/c"]
# Segundos que se espera a un script tras pedirle que pare (Ctrl+C o SIGTERM)
# antes de matarlo con SIGKILL, junto con la JVM de Spark.
espera_terminar_s = 30

# Fases del pipeline, en su orden obligatorio. Los scripts van relativos a la
# raíz del repositorio y se ejecutan en el orden de la lista. entrada y salida
# son claves de [rutas], no nombres de tablas. escribe_tablas indica si la fase
# escribe tablas Delta: sobre la base del repositorio exige --confirmar.
[[lanzador.fases]]
nombre = "ingesta"
scripts = ["src/ingesta/ingesta_faers.py"]
entrada = ["raw"]
salida = ["curated"]
escribe_tablas = true

[[lanzador.fases]]
nombre = "curacion"
# curar_demo.py va primero: los demás leen demo_curado.
scripts = [
    "src/curacion/curar_demo.py",
    "src/curacion/curar_drug.py",
    "src/curacion/curar_reac.py",
    "src/curacion/curar_outc.py",
    "src/curacion/curar_indi.py",
    "src/curacion/curar_ther.py",
    "src/curacion/curar_rpsr.py",
    "src/curacion/curar_geografia.py",
]
entrada = ["curated"]
salida = ["curated"]
escribe_tablas = true

[[lanzador.fases]]
nombre = "validacion"
scripts = ["src/curacion/validar_curacion.py"]
entrada = ["curated"]
salida = []
escribe_tablas = false

[[lanzador.fases]]
nombre = "analisis"
# prr_ror.py va primero: analisis_geografico.py lee senales_prr_ror.
scripts = [
    "src/analisis/prr_ror.py",
    "src/analisis/analisis_geografico.py",
    "src/analisis/analisis_temporal.py",
    "src/analisis/analisis_explorador.py",
    "src/analisis/analisis_explorador_cruces.py",
]
entrada = ["curated"]
salida = ["curated"]
escribe_tablas = true

[[lanzador.fases]]
nombre = "control"
scripts = ["src/analisis/validar_senales.py"]
entrada = ["curated"]
salida = ["outputs"]
escribe_tablas = false

# Scripts que el lanzador no ejecuta. --lista avisa de ellos.
[[lanzador.fuera]]
script = "src/curacion/traducir_terminos.py"
motivo = "escribe trad_terminos con argostranslate, que no está en requirements.txt (hasta la 0.7). Tras reconstruir, copia la tabla desde la base actual"
